  persist_dir: ./vectorstore
  collection_name: rag_documents

embedding:
  provider: auto
  model: text-embedding-3-small

llm:
  provider: gemini
  model: gemini-2.5-flash
  base_model: Qwen/Qwen2.5-3B-Instruct
  temperature: 0.0
